[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-support"
version = "0.1.0"
description = "Internal first-line support: deterministic workflow and grounded answers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.36,<2.1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2", "pgvector>=0.3,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
