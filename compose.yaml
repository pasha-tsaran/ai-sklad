x-app: &app
  build: .
  environment: &environment
    DATABASE_URL: postgresql+psycopg://support:${POSTGRES_PASSWORD:-local-demo-db}@db:5432/support
    API_TOKEN: ${API_TOKEN:-local-demo-token}
    LLM_BACKEND: ${LLM_BACKEND:-mock}
    OPENWEBUI_BASE_URL: ${OPENWEBUI_BASE_URL:-https://ai.collant.ru}
    OPENWEBUI_API_KEY: ${OPENWEBUI_API_KEY:-}
    OPENWEBUI_MODEL: ${OPENWEBUI_MODEL:-ai-support}
    LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
    SEED_DEMO_KNOWLEDGE: ${SEED_DEMO_KNOWLEDGE:-false}
    KNOWLEDGE_BACKEND: ${KNOWLEDGE_BACKEND:-openwebui}
    OPENWEBUI_KNOWLEDGE_IDS: ${OPENWEBUI_KNOWLEDGE_IDS:-[]}
    KNOWLEDGE_MAX_CHARS: ${KNOWLEDGE_MAX_CHARS:-20000}
    NEXTCLOUD_BACKEND: ${NEXTCLOUD_BACKEND:-mock}
    NEXTCLOUD_BASE_URL: ${NEXTCLOUD_BASE_URL:-}
    NEXTCLOUD_BOT_SECRET: ${NEXTCLOUD_BOT_SECRET:-}
    NEXTCLOUD_ALLOWED_ROOMS: ${NEXTCLOUD_ALLOWED_ROOMS:-[]}
    MAIL_BACKEND: ${MAIL_BACKEND:-mock}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
    INTEGRATION_TIMEOUT_SECONDS: ${INTEGRATION_TIMEOUT_SECONDS:-20}
    SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@example.invalid}
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-db}
      POSTGRES_DB: support
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U support -d support"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: [python, -m, app.bootstrap]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    <<: *app
    command: [python, -m, app.workers.main]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
